# .github/workflows/build.yml — VPN Pocket
# CI: gomobile bind -> vpntunnel.aar (arm64) -> Gradle debug APK.
# Pattern mirror từ build-dac-apk.yml (đã verify): SDK có sẵn trên ubuntu-latest,
# wrapper generate tại chỗ (tránh push jar binary qua API).
name: Build VPN Pocket

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - "vpntunnel/**"
      - "app/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  aar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: Setup Android SDK env
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install NDK (gomobile cần)
        run: |
          sdkmanager "ndk;29.0.14206865" || true
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          "$(go env GOPATH)/bin/gomobile" init
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # NOTE: must run from inside vpntunnel/ (the Go module dir). gomobile checks
      # for x/mobile via `go env GOMOD` + packages.Load in the current working
      # directory — running from the repo root (no go.mod, GOMOD=/dev/null) fails
      # the check even with the tool directive in go.mod.
      - name: Build AAR (arm64)
        working-directory: vpntunnel
        run: gomobile bind -target=android/arm64 -o ../vpntunnel.aar .

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: vpntunnel-aar
          path: vpntunnel.aar
          retention-days: 30

  apk:
    needs: aar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download AAR
        uses: actions/download-artifact@v4
        with:
          name: vpntunnel-aar
          path: app/libs

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK env
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 9.3.1 --no-daemon
          chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vpn-pocket-apk-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vpn-apk-${{ github.run_number }}
          name: VPN Pocket APK #${{ github.run_number }}
          files: app/build/outputs/apk/debug/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
